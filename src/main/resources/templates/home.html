<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Klioba — Clubs HEI</title>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

<div th:replace="fragments/header :: header"></div>

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#16163f] via-[#1a1a4e] to-[#2a1a3e]">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-80 h-80 bg-[#9933cc] opacity-10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-80 h-80 bg-purple-500 opacity-10 rounded-full blur-3xl"></div>
    </div>
    <div class="text-center px-6 relative z-10">
        <div class="text-white mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold mb-4 tracking-tight">Klioba</h1>
            <p class="text-lg sm:text-xl text-gray-300 max-w-md mx-auto leading-relaxed">Gérez les cotisations de votre club HEI simplement et en toute transparence.</p>
        </div>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/oauth2/authorization/casdoor"
               class="bg-[#9933cc] hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full text-lg transition-all transform hover:scale-105 inline-flex items-center gap-2 shadow-lg shadow-purple-500/25">
                <span>Commencer maintenant</span>
                <i class="material-icons">arrow_forward</i>
            </a>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-[#16163f] text-white py-8 sm:py-12">
    <div class="container mx-auto px-4 sm:px-6 text-center">
        <h3 class="text-xl sm:text-2xl font-bold mb-3 sm:mb-4">Contactez-nous</h3>
        <p class="mb-3 sm:mb-4 text-sm sm:text-base">Pour toute question sur les clubs HEI.</p>
        <p class="text-base sm:text-lg text-[#9933cc] font-semibold mb-2">contact@hei.school</p>
        <p class="mt-6 sm:mt-8 text-xs sm:text-sm text-gray-400">© 2026 Klioba — Clubs HEI. Tous droits réservés.</p>
    </div>
</footer>

</body>
</html>
